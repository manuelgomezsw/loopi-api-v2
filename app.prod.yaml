runtime: go124
service: default

# Conexión a Cloud SQL — prod
beta_settings:
  cloud_sql_instances: loopi-prod-497600:us-central1:loopi-db-prod

env_variables:
  ENV: prod
  GCP_PROJECT: loopi-prod-497600
  APP_VERSION: "1.0.0"
  OTEL_SERVICE_NAME: "loopi-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://dd-agent-HASH-uc.a.run.app"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65
