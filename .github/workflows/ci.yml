name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check project initialized
        id: check
        run: |
          if [ -f "go.mod" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::Go project not initialized yet, skipping build steps"
          fi

      - name: Setup Go
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        if: steps.check.outputs.ready == 'true'
        run: go vet ./...

      - name: Test
        if: steps.check.outputs.ready == 'true'
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: go build ./...
